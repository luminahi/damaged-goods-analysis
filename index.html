<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link href="./style.css" rel="stylesheet" />
    <title>Análise de Avarias</title>
  </head>
  <body>
    <div class="container">
      <div>
        <header>
          <h1>Análise de Avarias</h1>
          <p class="description">
            Selecione o <strong>Estoque Atual</strong> (.xls), um documento de
            <strong>Avaria</strong> (.txt) e
            <strong>Gere um Relatório</strong>
            do que precisa ser alterado em sua avaria.
          </p>
        </header>
      </div>

      <div id="buttons">
        <div>
          <label class="btn" for="storage-input">Estoque Atual</label>
          <input id="storage-input" hidden type="file" />
        </div>
        <div>
          <label class="btn" for="damaged-input">Avaria</label>
          <input id="damaged-input" hidden type="file" />
        </div>
        <div id="btn-analysis" class="btn">Gerar Relatório</div>
      </div>

      <div>
        <!-- <h2>Situação das Avarias</h2> -->
        <div id="legend">
          <div class="legend-column">
            <div class="box edit"></div>
            <p class="legend-info">Edite</p>
          </div>

          <div class="legend-column">
            <div class="box remove"></div>
            <p class="legend-info">Remova</p>
          </div>
        </div>
      </div>

      <div hidden id="status-container">
        <div id="status">
          <div class="status-description" id="status-all">
            <p>Total de Avarias: <span>0</span></p>
          </div>

          <div class="status-description" id="status-to-solve">
            <p>Avarias a Resolver: <span>0</span></p>
          </div>
        </div>
      </div>

      <div hidden id="damaged-goods">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Estoque Atual</th>
              <th>QTD Avariada</th>
              <th>QTD p/ Remover</th>
            </tr>
          </thead>
          <tbody id="table-damaged"></tbody>
        </table>
      </div>
    </div>

    <script src="./build/out.js"></script>
  </body>
</html>
